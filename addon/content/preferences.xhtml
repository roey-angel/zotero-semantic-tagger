<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<groupbox
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <label><html:h2 data-l10n-id="pref-title"></html:h2></label>

  <!-- Watcher toggle -->
  <checkbox
    id="zotero-prefpane-__addonRef__-watcher"
    preference="watcherEnabled"
    data-l10n-id="pref-watcher-enabled"
  />

  <!-- Claude API key -->
  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-apikey"
      data-l10n-id="pref-apikey-label"
    />
    <html:input
      type="password"
      id="zotero-prefpane-__addonRef__-apikey"
      preference="apiKey"
      style="flex: 1; margin-left: 8px"
    />
  </hbox>

  <!-- Model selection (populated from the Models API when a key is set) -->
  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-model"
      data-l10n-id="pref-model-label"
    />
    <menulist
      id="zotero-prefpane-__addonRef__-model"
      native="true"
      style="flex: 1; margin-left: 8px"
    >
      <menupopup />
    </menulist>
  </hbox>

  <!-- Strictness slider -->
  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-strictness"
      data-l10n-id="pref-strictness-label"
    />
    <html:input
      type="range"
      id="zotero-prefpane-__addonRef__-strictness"
      preference="strictness"
      min="0"
      max="100"
      step="1"
      style="flex: 1; margin: 0 8px"
    />
    <html:label data-l10n-id="pref-strictness-lax" />
    <html:label>–</html:label>
    <html:label data-l10n-id="pref-strictness-strict" />
  </hbox>

  <!-- Synonym file -->
  <hbox align="center">
    <html:label
      for="__addonRef__-synonyms-path"
      data-l10n-id="pref-synonyms-label"
    />
    <html:input
      type="text"
      id="__addonRef__-synonyms-path"
      preference="synonymFile"
      style="flex: 1; margin: 0 8px"
    />
    <button id="__addonRef__-synonyms-browse" data-l10n-id="pref-browse" />
  </hbox>

  <!-- Token warning threshold -->
  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-token-warn"
      data-l10n-id="pref-token-warn-label"
    />
    <html:input
      type="number"
      id="zotero-prefpane-__addonRef__-token-warn"
      preference="tokenWarnThreshold"
      min="0"
      step="1000"
      style="width: 80px; margin: 0 8px"
    />
    <html:label data-l10n-id="pref-token-warn-hint" />
  </hbox>

  <!-- PDF toggle -->
  <checkbox
    id="zotero-prefpane-__addonRef__-use-pdf"
    preference="usePdf"
    data-l10n-id="pref-use-pdf"
  />

  <!-- Python path -->
  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-python"
      data-l10n-id="pref-python-label"
    />
    <html:input
      type="text"
      id="zotero-prefpane-__addonRef__-python"
      preference="pythonPath"
      placeholder="python3  (or full path, e.g. /usr/local/bin/python3 or C:\Python313\python.exe)"
      style="flex: 1; margin: 0 8px"
    />
  </hbox>

  <!-- extract_pdf.py script path -->
  <hbox align="center">
    <html:label
      for="__addonRef__-script-path"
      data-l10n-id="pref-script-label"
    />
    <html:input
      type="text"
      id="__addonRef__-script-path"
      preference="scriptPath"
      style="flex: 1; margin: 0 8px"
    />
    <button id="__addonRef__-script-browse" data-l10n-id="pref-browse" />
  </hbox>

  <vbox>
    <html:label
      data-l10n-id="pref-help"
      data-l10n-args='{"version":"__buildVersion__"}'
      style="margin-top: 12px; color: gray"
    />
  </vbox>
</groupbox>
